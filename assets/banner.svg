<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>

    <style>
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.45; }
      }
      @keyframes floatData1 {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.25); opacity: 1; }
      }
      @keyframes waveFlow {
        0% { transform: translateX(0); }
        100% { transform: translateX(-400px); }
      }
      @keyframes ringRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .telemetry-flow {
        stroke-dasharray: 12 8;
        animation: floatData1 15s linear infinite;
      }
      .telemetry-fast {
        stroke-dasharray: 8 6;
        animation: floatData1 8s linear infinite;
      }
      .pulsing-dot {
        transform-origin: center;
        animation: pulseNode 3s ease-in-out infinite;
      }
      .grid-layer {
        animation: pulseGrid 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Animated Grid -->
  <rect width="1200" height="380" rx="16" fill="url(#grid)" class="grid-layer"/>

  <!-- Radial Background Ambient Glows (Behind Everything) -->
  <circle cx="150" cy="80" r="140" fill="#0284c7" opacity="0.12" filter="url(#glow-cyan)" />
  <circle cx="1050" cy="300" r="160" fill="#7c3aed" opacity="0.12" filter="url(#glow-purple)" />
  <circle cx="600" cy="190" r="220" fill="#3b82f6" opacity="0.08" filter="url(#glow-cyan)" />

  <!-- Animated Background Telemetry Pipeline Lines -->
  <g opacity="0.35">
    <!-- Top Stream -->
    <path d="M 50 70 Q 300 20 600 70 T 1150 50" fill="none" stroke="#38bdf8" stroke-width="2" class="telemetry-flow" />
    <path d="M 50 110 Q 400 160 800 100 T 1150 120" fill="none" stroke="#818cf8" stroke-width="1.5" class="telemetry-fast" />

    <!-- Bottom Metric Pulse Waves -->
    <path d="M 50 320 Q 250 270 450 320 T 850 310 T 1150 330" fill="none" stroke="#06b6d4" stroke-width="2" class="telemetry-fast" />
    <path d="M 50 340 Q 350 370 650 330 T 1150 350" fill="none" stroke="#c084fc" stroke-width="1.5" class="telemetry-flow" />
  </g>

  <!-- Dynamic Circuit / Pipeline Nodes in Background Corner -->
  <g opacity="0.4">
    <!-- Left Top Sensor Cluster -->
    <line x1="100" y1="90" x2="180" y2="140" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="180" y1="140" x2="140" y2="220" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="100" cy="90" r="5" fill="#38bdf8" class="pulsing-dot" />
    <circle cx="180" cy="140" r="4" fill="#818cf8" />
    <circle cx="140" cy="220" r="5" fill="#c084fc" class="pulsing-dot" />

    <!-- Right Bottom Collector Cluster -->
    <line x1="1020" y1="240" x2="1100" y2="200" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="1100" y1="200" x2="1060" y2="130" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="1020" cy="240" r="5" fill="#38bdf8" />
    <circle cx="1100" cy="200" r="6" fill="#06b6d4" class="pulsing-dot" />
    <circle cx="1060" cy="130" r="4" fill="#a855f7" />
  </g>

  <!-- Border Card with Gradient Stroke -->
  <rect x="2" y="2" width="1196" height="376" rx="15" fill="none" stroke="url(#primary-glow)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- ================= FOREGROUND CONTENT ================= -->
  <!-- Top Category Tag -->
  <g transform="translate(430, 48)">
    <rect x="0" y="0" width="340" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="15" r="4" fill="#22c55e" class="pulsing-dot"/>
    <text x="32" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">OPENTELEMETRY &amp; CLOUD-NATIVE</text>
  </g>

  <!-- Main Title with Crisp High-Contrast Gradient -->
  <g transform="translate(600, 140)">
    <text text-anchor="middle" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Monitoring &amp; Observability Agents
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 185)">
    <text text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="0.2">
      Curated Telemetry Collectors, DaemonSets, Single-Binary Shippers &amp; Vendor-Neutral Forwarders
    </text>
  </g>

  <!-- Feature / Signal Pills in Foreground -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: Metrics -->
    <g transform="translate(-360, 0)">
      <rect x="0" y="0" width="125" height="38" rx="19" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.8"/>
      <circle cx="20" cy="19" r="4" fill="#f59e0b"/>
      <text x="34" y="24" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📊 Metrics</text>
    </g>

    <!-- Pill 2: Logs -->
    <g transform="translate(-215, 0)">
      <rect x="0" y="0" width="115" height="38" rx="19" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.8"/>
      <circle cx="20" cy="19" r="4" fill="#0ea5e9"/>
      <text x="34" y="24" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📜 Logs</text>
    </g>

    <!-- Pill 3: Traces -->
    <g transform="translate(-80, 0)">
      <rect x="0" y="0" width="125" height="38" rx="19" fill="#1e293b" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8"/>
      <circle cx="20" cy="19" r="4" fill="#10b981"/>
      <text x="34" y="24" fill="#d1fae5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔍 Traces</text>
    </g>

    <!-- Pill 4: Continuous Profiling -->
    <g transform="translate(65, 0)">
      <rect x="0" y="0" width="135" height="38" rx="19" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.8"/>
      <circle cx="20" cy="19" r="4" fill="#a855f7"/>
      <text x="34" y="24" fill="#f3e8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Profiles</text>
    </g>

    <!-- Pill 5: OpenTelemetry Native -->
    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="150" height="38" rx="19" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.8"/>
      <circle cx="20" cy="19" r="4" fill="#6366f1"/>
      <text x="34" y="24" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🌐 OTel Native</text>
    </g>
  </g>

  <!-- Bottom Ecosystem Bar -->
  <g transform="translate(600, 335)">
    <text text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="1">
      ENTERPRISE SAAS &amp; OPEN-SOURCE ECOSYSTEM DIRECTORY • UPDATED 2026
    </text>
  </g>
</svg>
